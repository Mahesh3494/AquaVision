# Runs on every push and pull request:
#   test  — lint, format check, pytest (the real ONNX model, on the sample photos).
#   image — only on a push to main, and only if test passed: build the API image and
#           publish it to GitHub's container registry as ghcr.io/mahesh3494/aquavision.
# AquaManage's docker-compose.yml downloads that image instead of building this repo.

name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No floating major tag exists for setup-uv, so pin a full version.
      - uses: astral-sh/setup-uv@v10.3.2

      # The API's packages + dev (pytest, ruff). Streamlit (ui) isn't needed for tests.
      - run: uv sync --locked --no-group ui

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # GITHUB_TOKEN may read the code and write packages (the image), nothing else.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Log in to ghcr.io with the token GitHub gives every run: no secret to set up.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags per build: `latest` (what compose pulls) and `sha-<commit>`
      # (a fixed version you can go back to). Also adds labels that link the
      # image to this repo on GitHub.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mahesh3494/aquavision
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/setup-buildx-action@v4

      # Build the Dockerfile and push it. The cache lines keep unchanged layers
      # (Python packages) between runs, so a code-only change builds in seconds.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
